packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts are trusted (native binaries / engine downloads).
allowBuilds:
  '@prisma/engines': true
  argon2: true
  '@swc/core': true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# Pinned versions published within pnpm's minimum release-age window.
minimumReleaseAgeExclude:
  - bullmq@6.3.9
  - dotenv@18.0.4

# exceljs 4.4.0 pins uuid ^8 (GHSA advisory, fixed in 11.1.1); it only calls uuid.v4(), which
# uuid 11 still provides.
overrides:
  'exceljs>uuid': 11.1.1
